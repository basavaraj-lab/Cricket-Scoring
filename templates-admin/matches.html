<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Match Scorer</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Specific adjustments for scorer view */
        .ball-log {
            background: rgba(0,0,0,0.2);
            padding: 0.75rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin: 1rem 0;
            color: var(--text-muted);
        }
        .history-btns {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }
        .history-btns button {
            flex: 1;
        }
    </style>
</head>
<body>
<div id="nav_bar">
    <div id="nav-logo"><img src="/static/images/logo.png" alt="logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/5351/5351480.png'"></div>
    <a href="/home">Home</a>
    <a href="/matches" class="active">Live Scorer</a>
    <a href="/Team">Teams</a>
    <a href="/table">Table</a>
    <a href="/status">Status Board</a>
</div>

<div id="home-content">
    <div id="match" class="card">
        <!-- Match content will be injected here -->
        <div class="loader">Loading Match...</div>
    </div>
</div>

<script>
/* ── WebSocket Setup ────────────────── */
let socket;
function connectWS() {
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    socket = new WebSocket(`${protocol}//${window.location.host}/ws`);
    
    socket.onopen = () => console.log('Connected to Scoring Server');
    socket.onclose = () => {
        console.log('Disconnected. Retrying...');
        setTimeout(connectWS, 2000);
    };
}
connectWS();

function broadcastUpdate(data) {
    if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
            type: "score_update",
            data: data
        }));
    }
}

/* ── State Management ───────────────── */
const teamA = localStorage.getItem("TeamA") || "Team A";
const teamB = localStorage.getItem("TeamB") || "Team B";
const playersA = JSON.parse(localStorage.getItem("PlayersA") || "[]");
const playersB = JSON.parse(localStorage.getItem("PlayersB") || "[]");
const pA = playersA.length ? playersA : Array.from({length:11},(_,i)=>`${teamA} P${i+1}`);
const pB = playersB.length ? playersB : Array.from({length:11},(_,i)=>`${teamB} P${i+1}`);
const matchDate = new Date().toLocaleDateString();
const matchVenue = localStorage.getItem("Venue") || "KVG Cricket Ground";

let tossWinner = null;
let battingTeamName = "", bowlingTeamName = "";
let battingPlayers = [], bowlingPlayers = [];
let strikerIdx = 0, nonStrikerIdx = 1, bowlerIdx = 0;
let score = 0, wickets = 0, balls = 0, overs = 0;
let overBalls = [];
let innings = 1;
let firstInningsScore = 0;
let inn1BatterStats = {}, inn1BowlerStats = {};
let inn1BattingTeam = "", inn1BowlingTeam = "";
let inn1BattingPlayers = [], inn1BowlingPlayers = [];

let batterStats = {};
let bowlerStats = {};
const undoStack = [], redoStack = [];
const M = document.getElementById("match");

/* ── Helpers ────────────────────────── */
function bs(idx)  { return batterStats[idx]  || (batterStats[idx]  = {runs:0,balls:0,fours:0,sixes:0,dismissal:"",active:true}); }
function bwl(idx) { return bowlerStats[idx]  || (bowlerStats[idx]  = {runs:0,wickets:0,balls:0}); }

function strikerSR() {
    const b = bs(strikerIdx);
    return b.balls > 0 ? ((b.runs/b.balls)*100).toFixed(1) : "0.0";
}

function saveScorecard() {
    const data = {
        teamA,
        teamB,

        matchDate,
        matchVenue,

        innings,

        battingTeamName,
        bowlingTeamName,

        score,
        wickets,
        overs,
        balls,

        battingPlayers,
        bowlingPlayers,

        batterStats: JSON.parse(JSON.stringify(batterStats)),
        bowlerStats: JSON.parse(JSON.stringify(bowlerStats)),

        strikerIdx,
        nonStrikerIdx,
        bowlerIdx,

        firstInningsScore,

        inn1BatterStats: JSON.parse(JSON.stringify(inn1BatterStats)),
        inn1BowlerStats: JSON.parse(JSON.stringify(inn1BowlerStats)),

        inn1BattingTeam,
        inn1BowlingTeam,

        inn1BattingPlayers: [...inn1BattingPlayers],
        inn1BowlingPlayers: [...inn1BowlingPlayers]
    };
    localStorage.setItem("scorecard", JSON.stringify(data));
    broadcastUpdate(data); // Send to WebSocket
}
function saveMatchToServer() {
    const raw = localStorage.getItem("scorecard");
    fetch("/api/save-match", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: raw
    });
}

function stepMatchDetails() {

    M.innerHTML = `
    <h2>${teamA} VS ${teamB}</h2>
    <hr>
    <h3>🏏 Match Details</h3>
    <p><b>Overs</b></p>
    <select id="matchOvers">
        <option value="2">2 Overs</option>
        <option value="4">4 Overs</option>
        <option value="5" selected>5 Overs</option>
        <option value="10">10 Overs</option>
        <option value="20">20 Overs</option>
        <option value="50">50 Overs</option>
    </select>
    <br><br>
    <p><b>Ground</b></p>
    <input
        type="text"
        id="matchGround"
        placeholder="Enter Ground Name"
        value="KVG Cricket Ground">
    <br><br>
    <p><b>Date</b></p>
    <input
        type="date"
        id="matchDate"
        value="${new Date().toISOString().split("T")[0]}">
    <br><br>
    <button id="nextBtn">
        Next →
    </button>
    `;
    document.getElementById("nextBtn").onclick = function () {
        localStorage.setItem(
            "MatchOvers",
            document.getElementById("matchOvers").value
        );
        localStorage.setItem(
            "Venue",
            document.getElementById("matchGround").value
        );
        localStorage.setItem(
            "MatchDate",
            document.getElementById("matchDate").value
        );
        stepToss();
    };
    
}
/* ── STEP 1 ─────────────────────────── */
function stepMatchCard() {
    M.innerHTML = `
        <h2 style="color:var(--accent-gold)">Ready for Battle?</h2>
        <p style="margin-bottom:2rem">${teamA} vs ${teamB}</p>
        <button class="btn-primary" id="startBtn">▶ Start Match Setup</button>
    `;
    document.getElementById("startBtn").onclick = stepToss;
}

function stepToss() {
    M.innerHTML = `
        <h3>🪙 Coin Toss</h3>
        <p>Who calls the toss?</p>
        <div style="display:flex; gap:1rem; margin:1rem 0">
            <label style="flex:1"><input type="radio" name="caller" value="A"> ${teamA}</label>
            <label style="flex:1"><input type="radio" name="caller" value="B"> ${teamB}</label>
        </div>
        <p>Choice:</p>
        <div style="display:flex; gap:1rem; margin:1rem 0">
            <label style="flex:1"><input type="radio" name="coinChoice" value="Head"> Head</label>
            <label style="flex:1"><input type="radio" name="coinChoice" value="Tail"> Tail</label>
        </div>
        <div id="toss-result" style="margin:1rem 0; font-weight:700; color:var(--accent-emerald)"></div>
        <button class="btn-primary" id="flipBtn" style="width:100%">Flip Coin</button>
    `;

    document.getElementById("flipBtn").onclick = () => {
        const caller = document.querySelector('input[name="caller"]:checked');
        const choice = document.querySelector('input[name="coinChoice"]:checked');
        if (!caller || !choice) { alert("Select caller and side!"); return; }
        
        const result = Math.random() < 0.5 ? "Head" : "Tail";
        const won = choice.value === result;
        tossWinner = won ? (caller.value === "A" ? teamA : teamB) : (caller.value === "A" ? teamB : teamA);
        
        document.getElementById("toss-result").textContent = `It's ${result}! ${tossWinner} wins the toss.`;
        document.getElementById("flipBtn").disabled = true;
        setTimeout(stepBatBowlChoice, 1200);
    };
}

function stepBatBowlChoice() {
    M.innerHTML = `
        <h3>🏆 ${tossWinner} wins!</h3>
        <p>Deciding to...</p>
        <div style="display:flex; gap:1rem; margin-top:1.5rem">
            <button class="btn-primary" style="flex:1" id="batBtn">🏏 Bat First</button>
            <button class="btn-primary" style="flex:1" id="bowlBtn">🎳 Bowl First</button>
        </div>
    `;
    document.getElementById("batBtn").onclick  = () => setupTeams("bat");
    document.getElementById("bowlBtn").onclick = () => setupTeams("bowl");
}

function setupTeams(choice) {
    const batting = choice === "bat" ? tossWinner : (tossWinner === teamA ? teamB : teamA);
    const bowling = batting === teamA ? teamB : teamA;
    battingTeamName = batting; bowlingTeamName = bowling;
    battingPlayers = batting === teamA ? [...pA] : [...pB];
    bowlingPlayers  = bowling === teamA ? [...pA] : [...pB];
    stepSelectPlayers();
}

function stepSelectPlayers() {
    const bOpts  = battingPlayers.map((p,i)=>`<option value="${i}">${p}</option>`).join("");
    const bwOpts = bowlingPlayers.map((p,i)=>`<option value="${i}">${p}</option>`).join("");
    M.innerHTML = `
        <h3>Setup Lineup</h3>
        <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:1.5rem">
            Batting: ${battingTeamName} | Bowling: ${bowlingTeamName}
        </p>
        <div style="text-align:left">
            <label>Striker</label><select id="sel-striker">${bOpts}</select>
            <label>Non-Striker</label><select id="sel-nonstriker">${bOpts}</select>
            <label>Opening Bowler</label><select id="sel-bowler">${bwOpts}</select>
        </div>
        <button class="btn-primary" id="startScoringBtn" style="width:100%; margin-top:1rem">▶ Start Match</button>
    `;
    document.getElementById("sel-nonstriker").selectedIndex = 1;
    document.getElementById("startScoringBtn").onclick = () => {
        strikerIdx    = +document.getElementById("sel-striker").selectedIndex;
        nonStrikerIdx = +document.getElementById("sel-nonstriker").selectedIndex;
        bowlerIdx     = +document.getElementById("sel-bowler").selectedIndex;
        resetStats();
        bs(strikerIdx).active = true;
        bs(nonStrikerIdx).active = true;
        stepScoring();
    };
}

function stepScoring() {
    M.innerHTML = `
        <div class="scoreboard" id="scoreboard">0/0</div>
        <div class="over-indicator" id="overs-el">0.0 Overs</div>
        
        <div class="player-card striker">
            <div class="player-info">
                <div class="player-name" id="striker-name">-</div>
                <div style="font-size:0.8rem; color:var(--text-muted)">SR: <span id="striker-sr">0.0</span></div>
            </div>
            <div class="player-score" id="striker-score">0(0)</div>
        </div>
        
        <div class="player-card">
            <div class="player-name" id="nonstriker-name">-</div>
            <div class="player-score" id="nonstriker-score">0(0)</div>
        </div>
        
        <div style="display:flex; justify-content:space-between; align-items:center; margin:1rem 0; font-size:0.9rem">
            <span>🎳 <span id="bowler-name">-</span></span>
            <span id="bowler-stats" style="color:var(--accent-gold)">0-0 (0.0)</span>
        </div>

        <div class="score-grid">
            <button class="score-btn" onclick="addRuns(1)">1</button>
            <button class="score-btn" onclick="addRuns(2)">2</button>
            <button class="score-btn" onclick="addRuns(3)">3</button>
            <button class="score-btn highlight" onclick="addRuns(4)">4</button>
            <button class="score-btn highlight" onclick="addRuns(6)">6</button>
            <button class="score-btn" onclick="addRuns(0)">0</button>
        </div>
        
        <div class="wicket-grid">
            <button class="wicket-btn" onclick="addWicket('Out')">WICKET</button>
            <button class="wicket-btn" style="background:rgba(245,158,11,0.1); color:var(--accent-gold)" onclick="addExtra('Wide')">WIDE</button>
            <button class="wicket-btn" style="background:rgba(245,158,11,0.1); color:var(--accent-gold)" onclick="addExtra('No Ball')">NO BALL</button>
            <button class="wicket-btn" style="background:rgba(255,255,255,0.05); color:white" onclick="undo()">UNDO</button>
        </div>
        
        <div class="ball-log" id="ball-log">Over Progress: —</div>
    `;
    updateScoreboard();
}

function updateScoreboard() {
    if (!document.getElementById("scoreboard")) return;
    document.getElementById("scoreboard").textContent = `${score}/${wickets}`;
    document.getElementById("overs-el").textContent = `${overs}.${balls%6} Overs`;

    const bat1 = bs(strikerIdx), bat2 = bs(nonStrikerIdx);
    document.getElementById("striker-name").textContent     = battingPlayers[strikerIdx] + "*";
    document.getElementById("striker-score").textContent    = `${bat1.runs}(${bat1.balls})`;
    document.getElementById("striker-sr").textContent       = strikerSR();
    document.getElementById("nonstriker-name").textContent  = battingPlayers[nonStrikerIdx];
    document.getElementById("nonstriker-score").textContent = `${bat2.runs}(${bat2.balls})`;

    const bw = bwl(bowlerIdx);
    document.getElementById("bowler-name").textContent  = bowlingPlayers[bowlerIdx];
    document.getElementById("bowler-stats").textContent = `${bw.wickets}W - ${bw.runs}R (${Math.floor(bw.balls/6)}.${bw.balls%6})`;

    const logEl = document.getElementById("ball-log");
    logEl.textContent = "Over Progress: " + (overBalls.length ? overBalls.join(" • ") : "—");
    
    saveScorecard();
}

/* ── Logic ──────────────────────────── */
function addRuns(r) {
    saveState();
    score += r; balls++;
    const bat = bs(strikerIdx);
    bat.runs += r; bat.balls++;
    if (r === 4) bat.fours++;
    if (r === 6) bat.sixes++;
    const bw = bwl(bowlerIdx);
    bw.runs += r; bw.balls++;
    overBalls.push(r === 0 ? "·" : r);
    if (r % 2 !== 0) swapStrike();
    checkOver(); updateScoreboard();
    if (innings === 2 && score > firstInningsScore) {
        checkOver(); updateScoreboard(); saveScorecard(); sendLiveScore();
        stepMatchResult(); return;
    }
    checkOver(); updateScoreboard(); saveScorecard();
    sendLiveScore();   // <-- ADD THIS
}

function addWicket(type) {
    saveState();
    wickets++; balls++;
    const bat = bs(strikerIdx);
    bat.balls++; bat.dismissal = type; bat.active = false;
    const bw = bwl(bowlerIdx);
    bw.wickets++; bw.balls++;
    overBalls.push("W");

    checkOver(); updateScoreboard();
    if (wickets < 10) stepNextBatter();
    else endInnings();
    checkOver(); updateScoreboard(); saveScorecard();
    sendLiveScore();   // <-- ADD THIS
    stepNextBatter();
   
}

function addExtra(type) {
    saveState();
    score++;
    bwl(bowlerIdx).runs++;
    overBalls.push(type === 'Wide' ? 'Wd' : 'Nb');
    updateScoreboard();
}

function checkOver() {
    const legal = overBalls.filter(b => b !== "Wd" && b !== "Nb").length;
    if (legal === 6) { 
        overs++; overBalls = []; swapStrike(); 
        if (wickets < 10) stepChangeBowler(); 
    }
}

function swapStrike() { [strikerIdx, nonStrikerIdx] = [nonStrikerIdx, strikerIdx]; }

function stepNextBatter() {
    const used = Object.keys(batterStats).map(Number);
    const fresh = battingPlayers.map((p,i) => ({p,i})).filter(({i}) => !used.includes(i));
    const opts = fresh.map(({p,i}) => `<option value="${i}">${p}</option>`).join("");

    M.innerHTML = `
        <h3>Howzat! Wicket Down</h3>
        <p>Select next batter:</p>
        <select id="sel-next">${opts}</select>
        <button class="btn-primary" id="confirmNext" style="width:100%">Continue</button>
    `;

    document.getElementById("confirmNext").onclick = () => {
        strikerIdx = +document.getElementById("sel-next").value;
        bs(strikerIdx).active = true;
        stepScoring(); updateScoreboard();
    };
}

function stepChangeBowler() {
    const opts = bowlingPlayers.map((p,i) => `<option value="${i}" ${i === bowlerIdx ? 'disabled' : ''}>${p}</option>`).join("");
    M.innerHTML = `
        <h3>Over Complete</h3>
        <p>Select next bowler:</p>
        <select id="sel-bowler-change">${opts}</select>
        <button class="btn-primary" id="confirmBowler" style="width:100%">Continue</button>
    `;
    document.getElementById("confirmBowler").onclick = () => {
        bowlerIdx = +document.getElementById("sel-bowler-change").value;
        stepScoring(); updateScoreboard();
    };
}

function endInnings() {
    if (innings === 1) {
        firstInningsScore = score;
        inn1BatterStats = JSON.parse(JSON.stringify(batterStats));
        inn1BowlerStats = JSON.parse(JSON.stringify(bowlerStats));
        inn1BattingTeam = battingTeamName;
        inn1BowlingTeam = bowlingTeamName;
        
        M.innerHTML = `
            <h3>Innings Complete</h3>
            <div class="scoreboard">${score}/${wickets}</div>
            <p>Target for ${bowlingTeamName}: ${score + 1}</p>
            <button class="btn-primary" id="startInn2Btn" style="width:100%; margin-top:2rem">Start 2nd Innings</button>
        `;
        document.getElementById("startInn2Btn").onclick = () => {
            [battingTeamName, bowlingTeamName] = [bowlingTeamName, battingTeamName];
            [battingPlayers, bowlingPlayers]   = [bowlingPlayers, battingPlayers];
            innings = 2;
            score = wickets = balls = overs = 0;
            overBalls = []; batterStats = {}; bowlerStats = {};
            stepSelectPlayers();
        };
    } else {
        stepMatchResult();
    }
}

function stepMatchResult() {
    saveMatchToServer();
    let result = score > firstInningsScore ? `${battingTeamName} won!` : (score === firstInningsScore ? "Match Tied!" : `${bowlingTeamName} won!`);
    M.innerHTML = `
        <h3>Match Ended</h3>
        <div class="scoreboard">${score}/${wickets}</div>
        <h2 style="color:var(--accent-gold)">${result}</h2>
        <button class="btn-primary" onclick="location.reload()" style="width:100%; margin-top:2rem">New Match</button>
    `;
}

function saveMatchToServer() {
    fetch("/api/save-match", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: localStorage.getItem("scorecard")
    }).catch(e => console.error(e));
}

function resetStats() { score = wickets = balls = overs = 0; overBalls = []; batterStats = {}; bowlerStats = {}; undoStack.length = 0; }
function saveState() { undoStack.push(snapshot()); }
function snapshot() { return { score, wickets, balls, overs, strikerIdx, nonStrikerIdx, bowlerIdx, overBalls: [...overBalls], batterStats: JSON.parse(JSON.stringify(batterStats)), bowlerStats: JSON.parse(JSON.stringify(bowlerStats)) }; }
function undo() { if (undoStack.length) { restoreState(undoStack.pop()); stepScoring(); updateScoreboard(); } }
function restoreState(s) { ({score, wickets, balls, overs, strikerIdx, nonStrikerIdx, bowlerIdx} = s); overBalls = [...s.overBalls]; batterStats = JSON.parse(JSON.stringify(s.batterStats)); bowlerStats = JSON.parse(JSON.stringify(s.bowlerStats)); }

// const teamA = localStorage.getItem("TeamA") || "Team A";
// const teamB = localStorage.getItem("TeamB") || "Team B";

async function sendLiveScore() {

    const liveScore = {
        runs: score,
        wickets: wickets,
        overs: `${overs}.${balls % 6}`,
        match: {
            team1: teamA,
            team2: teamB,
            venue: "KVG Cricket Ground",
            date: new Date().toLocaleDateString(),
            status: "LIVE",
            innings: innings
        },
       striker: {
            name: battingPlayers[strikerIdx],
            ...bs(strikerIdx),
            strikeRate: strikerSR()
        },
        nonStriker: {
            name: battingPlayers[nonStrikerIdx],
            ...bs(nonStrikerIdx),
            strikeRate: nonStrikerSR()
        },
        bowler: {
            name: bowlingPlayers[bowlerIdx],
            ...bwl(bowlerIdx)
        },
        batterStats: batterStats,
        bowlerStats: bowlerStats,
        battingPlayers: battingPlayers,
        bowlingPlayers: bowlingPlayers
    };
    console.log("Sending:", liveScore);

    await fetch("/api/update-score",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify(liveScore)
    });
}

stepMatchCard();
</script>
</body>
</html>
