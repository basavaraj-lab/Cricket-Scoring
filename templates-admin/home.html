<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket League Admin</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="nav_bar">
    <div id="nav-logo"><img src="/static/images/logo.png" alt="logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/5351/5351480.png'"></div>
    <a href="/home" class="active">Home</a>
    <a href="/matches">Live Scorer</a>
    <a href="/Team">Teams</a>
    <a href="/table">Table</a>
    <a href="/status">Status Board</a>
</div>

<div id="home-content">
    <div class="card" style="text-align:center; padding: 4rem 2rem;">
        <h1 style="font-size: 3.5rem; margin-bottom: 1rem; color: var(--accent-gold);">Pro Cricket Scoring</h1>
        <p style="font-size: 1.2rem; color: var(--text-muted); max-width: 600px; margin: 0 auto 3rem;">
            Real-time analytics, glassmorphic UI, and instant broadcast for your local cricket tournaments.
        </p>
        
        <div style="display:flex; gap:1.5rem; justify-content:center;">
            <button class="btn-primary" style="padding: 1rem 2rem;" onclick="location.href='/matches'">
                ▶ Start Scoring Now
            </button>
            <button class="btn-secondary" style="padding: 1rem 2rem;" onclick="location.href='/Team'">
                Manage Teams
            </button>
        </div>
    </div>
</div>
</body>
</html>
